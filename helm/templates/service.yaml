apiVersion: v1
kind: Service
metadata:
  name: {{ include "mapr-sandbox.fullname" . }}
  labels:
    {{- include "mapr-sandbox.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      appProtocol: https
  selector:
    {{- include "mapr-sandbox.selectorLabels" . | nindent 4 }}
