services:
  dfdemo:
    build:
      context: .
      dockerfile: Dockerfile
    image: dfdemo:1.0.0
    container_name: dfdemo
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    # Privileged mode required for NFS mount operations
    privileged: true
    volumes:
      # NFS mount point for Data Fabric volumes
      - mapr_mount:/mapr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mapr_mount:
    driver: local