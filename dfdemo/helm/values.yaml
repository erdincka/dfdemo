ezua:
  virtualService:
    endpoint: "dfdemo.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"

replicaCount: 1

image:
  repository: erdincka/dfdemo
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podLabels: {}

securityContext: {}
  # privileged: true
  # capabilities:
  #   add:
  #     - SYS_ADMIN

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

env:
  LOG_LEVEL: "INFO"
  PYTHONUNBUFFERED: "1"

resources:
  limits:
    cpu: "2"
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /api/health
    port: 8000
    scheme: HTTP
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health
    port: 8000
    scheme: HTTP
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}

tolerations: []

affinity: {}
