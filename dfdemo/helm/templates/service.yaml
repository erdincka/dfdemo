apiVersion: v1
kind: Service
metadata:
  name: {{ include "dfdemo.fullname" . }}
  labels:
    {{- include "dfdemo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "dfdemo.selectorLabels" . | nindent 4 }}