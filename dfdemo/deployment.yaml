apiVersion: apps/v1
kind: Deployment
metadata:
  name: dfdemo-deployment
  namespace: dev
  labels:
    app: dfdemo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dfdemo
  template:
    metadata:
      labels:
        app: dfdemo
    spec:
      containers:
        - name: dfdemo-app
          image: erdincka/dfdemo:latest
          imagePullPolicy: Always
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            limits:
              cpu: "2"
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
          volumeMounts:
            - name: mapr-mount
              mountPath: /mapr
      volumes:
        - name: mapr-mount
          emptyDir: {}
      nodeSelector: {}
      affinity: {}
      tolerations: []

---
apiVersion: v1
kind: Service
metadata:
  name: dfdemo-svc
  namespace: dev
  labels:
    app: dfdemo
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
      appProtocol: http
  selector:
    app: dfdemo

---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: dfdemo-vs
  namespace: dev
  labels:
    app: dfdemo
spec:
  gateways:
    - "istio-system/ezaf-gateway"
  hosts:
    - dfdemo.demo.lon-pcai.twlon.com
  http:
    - match:
        - uri:
            prefix: "/"
      route:
        - destination:
            host: dfdemo-svc.dev.svc.cluster.local
            port:
              number: 8000